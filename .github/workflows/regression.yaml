name: Regression tests

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - 'upstream-main-*'
      - 'fix/verify-presence-retry-2026-11'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install MQTT integration test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox mosquitto mosquitto-clients
          python -m pip install -r requirements-dev.txt
      - name: Python syntax, unit tests and MQTT integration tests
        run: |
          python -m compileall -q presence-detector.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upstream Python style and typing checks
        run: |
          black --diff --check presence-detector.py
      - name: Upstream pylint and mypy diagnostics
        if: always()
        run: |
          pylint presence-detector.py
          mypy presence-detector.py
      - name: BusyBox shell syntax and regression tests
        run: |
          busybox ash -n presence-detector.sh
          busybox ash tests/test_shell_discovery_retry.sh presence-detector.sh
